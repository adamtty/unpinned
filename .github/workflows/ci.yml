name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  # renovate: datasource=pypi depName=uv
  UV_VERSION: 0.13.4
  # renovate: datasource=pypi depName=zizmor
  ZIZMOR_VERSION: 1.31.1
  # renovate: datasource=pypi depName=pip-audit
  PIP_AUDIT_VERSION: 2.10.1
  # newest CPython that Atheris publishes wheels for (see the fuzzing job)
  ATHERIS_PYTHON: "3.14"
  # use the Python that setup-python installed; never download one
  UV_PYTHON_DOWNLOADS: never

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@dc2769abcc0fcfbadfc1df54081c1608579ef6b2 # v2.22.2
        with:
          egress-policy: block
          allowed-endpoints: >
            github.com:443
            release-assets.githubusercontent.com:443
            objects.githubusercontent.com:443
            pypi.org:443
            files.pythonhosted.org:443

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.15"

      - name: Install uv
        run: pipx install "uv==${UV_VERSION}"

      - run: uv sync --locked --group dev

      - name: ruff (lint, incl. bandit security rules)
        run: uv run ruff check src tests

      - name: ruff (formatting)
        run: uv run ruff format --check src tests

      - name: zizmor (workflow security)
        run: pipx run "zizmor==${ZIZMOR_VERSION}" --offline --min-severity low .github/workflows

      # every locked dependency (runtime and dev) against the PyPI advisory database
      - name: pip-audit (known vulnerabilities in uv.lock)
        run: |
          uv export --locked --all-groups --no-emit-project --format requirements-txt > "$RUNNER_TEMP/locked.txt"
          pipx run "pip-audit==${PIP_AUDIT_VERSION}" --disable-pip --require-hashes -r "$RUNNER_TEMP/locked.txt"

  test:
    name: Tests (${{ matrix.python }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.12", "3.13", "3.14"]
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@dc2769abcc0fcfbadfc1df54081c1608579ef6b2 # v2.22.2
        with:
          egress-policy: block
          allowed-endpoints: >
            github.com:443
            release-assets.githubusercontent.com:443
            objects.githubusercontent.com:443
            pypi.org:443
            files.pythonhosted.org:443

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python }}

      - name: Install uv
        run: pipx install "uv==${UV_VERSION}"

      - run: uv sync --locked --group dev --python "$(command -v python)"

      # APK and bundle reading, the DEX parser, certificates, config rendering, the patch rewrites, and a replay of
      # the fuzz harness over its corpus plus seeded mutations (no device or Android SDK needed)
      - name: Tests
        run: uv run pytest -q

  fuzz:
    name: Fuzz
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@dc2769abcc0fcfbadfc1df54081c1608579ef6b2 # v2.22.2
        with:
          egress-policy: block
          allowed-endpoints: >
            github.com:443
            release-assets.githubusercontent.com:443
            objects.githubusercontent.com:443
            pypi.org:443
            files.pythonhosted.org:443

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Atheris only ships Linux x86-64 wheels, for CPython 3.12-3.14 (3.1.0 has none for 3.15). The
      # version is an expression so Renovate leaves it alone: raise it when an Atheris release adds wheels.
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ env.ATHERIS_PYTHON }}

      # unpinned's own dependencies, hash-pinned from uv.lock, then Atheris (hash-pinned too)
      - name: Install (hash-checked)
        run: |
          pipx install "uv==${UV_VERSION}"
          uv export --locked --no-dev --no-emit-project --format requirements-txt > "$RUNNER_TEMP/deps.txt"
          python -m pip install --require-hashes --no-deps -r "$RUNNER_TEMP/deps.txt"
          python -m pip install --require-hashes --only-binary :all: -r tests/requirements-fuzz.txt

      # coverage-guided; -timeout makes any input slower than 10 s (a parser blow-up) a failure
      - name: Fuzz the DEX, bundle, certificate, address and rewrite parsers
        env:
          PYTHONPATH: src
        run: |
          mkdir -p "$RUNNER_TEMP/crashes"
          cp -r tests/fuzz-corpus/parsers "$RUNNER_TEMP/corpus"
          python tests/fuzz_parsers.py "$RUNNER_TEMP/corpus" -max_total_time=300 -timeout=10 -rss_limit_mb=2048 \
            -artifact_prefix="$RUNNER_TEMP/crashes/"

      - name: Keep crashing inputs
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: fuzz-crashes
          path: ${{ runner.temp }}/crashes/
          retention-days: 14
